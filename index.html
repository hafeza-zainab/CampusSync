<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>College Attendance Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- LOGIN -->
  <div id="loginBox" class="login-container">
    <h2>College Attendance</h2>
    <label for="username">College ID</label>
    <input type="text" id="username" placeholder="College ID, e.g. DEMO-CS-001" autocomplete="off" maxlength="20">
    <select id="role">
      <option value="student">Student</option>
      <option value="cr">CR</option>
      <option value="acr">ACR</option>
    </select>
    <button onclick="login()">Enter</button>
    <p id="loginError" role="alert"></p>
    <p class="login-hint">Demo accounts (placeholder IDs, not real people): DEMO-CS-001 to DEMO-CS-004.
      Only a college ID is asked for: no phone number or email.</p>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard" class="hidden">
    <header>
      <h3 id="welcome"></h3>
      <button onclick="logout()" class="logout-btn">Logout</button>
    </header>

    <nav class="tab-nav">
      <button onclick="showTab('calendar')">📅 Calendar</button>
      <button onclick="showTab('attendance')">📝 Attendance</button>
      <button onclick="showTab('study')">📚 Study Panel</button>
      <button onclick="showTab('announcements')">📢 Announcements</button>
    </nav>

    <!-- CALENDAR -->
    <section id="calendar" class="tab">
      <div class="calendar-header">
        <button onclick="prevMonth()">◀</button>
        <h3 id="monthYear"></h3>
        <button onclick="nextMonth()">▶</button>
      </div>
      <p class="calendar-hint">Click a subject to mark attendance.</p>

      <div class="calendar-layout">
        <div class="calendar-main">
          <div class="weekdays">
            <div>Mon</div><div>Tue</div><div>Wed</div>
            <div>Thu</div><div>Fri</div><div>Sat</div><div>Sun</div>
          </div>
          <div id="calendarGrid" class="calendar-grid"></div>
        </div>

        <aside id="statsPanel" class="stats-panel">
          <h4>📊 Monthly Stats</h4>
          <div id="stats"></div>
        </aside>
      </div>
    </section>

    <!-- ATTENDANCE -->
    <section id="attendance" class="tab hidden">
      <h3>Self Attendance</h3>
      <div id="attendanceList"></div>
      <p id="warning"></p>
      <div id="presentCount"></div>
    </section>

    <!-- STUDY PANEL -->
    <section id="study" class="tab hidden">
      <h3>Study Materials</h3>
      <div id="materialsList"></div>
    </section>

    <!-- ANNOUNCEMENTS -->
    <section id="announcements" class="tab hidden">
      <h3>Announcements</h3>
      <div class="announce-input">
        <input type="text" id="msg" placeholder="Type announcement...">
        <button onclick="postAnnouncement()">Post</button>
      </div>
      <div id="announceList"></div>
    </section>
  </div>

  <script src="store.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
  <script src="chat.js"></script>
</body>
</html>
